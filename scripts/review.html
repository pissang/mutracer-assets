<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuTracer 模型预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14161b;color:#e5e7ed;font:15px/1.6 system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:40px 28px}h1{font-size:28px;margin:0}p{color:#a0a6b7}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}button{border:1px solid #454b5b;border-radius:8px;background:#272c37;color:inherit;padding:8px 14px;cursor:pointer}button:hover{background:#3b4354}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}.card{background:#20232c;border:1px solid #343948;border-radius:12px;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#292b30}.details{padding:18px}.name{font-size:18px;margin:0 0 8px}.facts{color:#aeb5c7;margin-bottom:12px}.badge{display:inline-block;border-radius:5px;padding:2px 8px;background:#304234;color:#a6dab0}.badge.r2{background:#44391f;color:#ead194}a{color:#9ebdff}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.remove{color:#ffaaaa;border-color:#69414a}#status{color:#ead194;margin:12px 0;min-height:24px}.pending{margin-top:30px;color:#a0a6b7}code{background:#292e38;padding:2px 5px;border-radius:4px}
</style>
<main><header><div><h1>MuTracer 示例模型</h1><p>先检查截图和材质，再保留你需要的模型。所有截图均由 MuTracer 渲染。</p></div><button id="refresh">刷新列表</button></header>
<p>移除会更新本地模型清单，文件保留在 <code>work/removed</code>。GitHub commit / push 由你手动执行。</p>
<div id="status" role="status"></div><div id="grid" class="grid"></div><div id="pending" class="pending"></div></main>
<script type="module">
const status=document.querySelector('#status');
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node};
async function edit(id,action){status.textContent='正在更新…';try{const response=await fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});const data=await response.json();if(!response.ok)throw Error(data.error);await refresh();status.textContent=action==='remove'?'已移除，文件已保留在本地回收目录。':'托管方式已更新。';}catch(error){status.textContent=error.message}}
async function refresh(){const {models,pending}=await(await fetch('/api/models',{cache:'no-store'})).json();document.querySelector('#grid').replaceChildren();for(const model of models){const card=el('article',undefined,'card');const img=el('img');img.src=`/assets/${model.id}/thumbnail.webp?v=${model.previewSha256||model.sha256}`;img.alt=model.name;card.append(img);const detail=el('div',undefined,'details');detail.append(el('h2',model.name,'name'));detail.append(el('div',`${model.bytes?`${model.sizeMB} MB · `:''}${model.license}${model.textureSize?' · 1K':''}`,'facts'));detail.append(el('span',model.reviewOnly?'仅本地预览 · 不发布':model.delivery==='external'?(model.url?'Khronos · 截图 GitHub':'程序化 · 截图 GitHub'):model.delivery==='github'?'GitHub / jsDelivr':model.r2Url?'R2 已上传':model.r2Key?'R2 已上传 · 待域名':'R2 待上传',`badge ${model.delivery==='r2'?'r2':''}`));if(model.nonCommercial)detail.append(el('p','仅限非商业用途，保留模型原许可。'));if(model.materialNotes)detail.append(el('p',model.materialNotes));const source=el('p');source.append(el('span','作者：'));const link=el('a',model.credit);link.href=model.sourceUrl;link.target='_blank';link.rel='noopener noreferrer';source.append(link);const license=el('a',model.license);license.href=model.licenseUrl;license.target='_blank';license.rel='noopener noreferrer';source.append(el('span',' · '),license);detail.append(source);const actions=el('div',undefined,'actions');const toggle=el('button',model.delivery==='external'?'仅托管截图':model.delivery==='github'?'改用 R2':'改用 GitHub');toggle.disabled=model.delivery==='external'||model.reviewOnly||(model.delivery==='r2'&&model.bytes>20000000);toggle.onclick=()=>edit(model.id,model.delivery==='github'?'r2':'github');const remove=el('button','移除模型','remove');remove.onclick=()=>edit(model.id,'remove');actions.append(toggle,remove);detail.append(actions);card.append(detail);document.querySelector('#grid').append(card)}document.querySelector('#pending').textContent=pending.length?`尚未导入 ${pending.length} 个模型：${pending.map(x=>x.id).join('、')}`:models.length?`共 ${models.length} 个模型。筛选完成后运行 npm run catalog -- --version v0.1.0。`:'目前没有模型。运行 npm run import 开始导入。'}
document.querySelector('#refresh').onclick=refresh;refresh().catch(error=>status.textContent=error.message);
</script></html>
